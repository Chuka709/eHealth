[project]
name = "labtrack"
version = "0.1.0"
description = "LabTrack MN API, worker and clinical core"
authors = [
    { name = "d3v310p3r1437", email = "b.chuka@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "celery[redis]>=5.6.3",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.1",
    "redis>=6.4.0",
    "sentry-sdk>=2.73.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.12",
    "mypy>=2.4.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "TID", "N", "UP", "B", "S", "A", "C4", "DTZ", "T20", "SIM", "RUF", "ASYNC", "PT", "PL", "TRY"]
# RUF001-003: Mongolian Cyrillic text is expected, not a homoglyph attack.
ignore = ["PLR0913", "TRY003", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106", "PLR0917"]  # pytest fixtures are positional
# Migrations compose DDL from module constants only (no runtime input).
"alembic/**" = ["N999", "S608"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sqlalchemy.text".msg = "Use labtrack.db.sql.bound_text (bind parameters only, never f-strings) - docs/03 RLS"

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["celery.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["db: needs a PostgreSQL container"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
