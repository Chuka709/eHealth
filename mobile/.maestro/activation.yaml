# Phase 1 DoD (+ Phase 2.5): a registered user activates with the admin's QR/link, sets their own password,
# signs in, gives the consents and reaches Home (docs/01 Phase 1 DoD, docs/08 "Анх нэвтрэх").
#
# Run with `just e2e-mobile`: it provisions the user and passes the values as MAESTRO_*
# environment variables (never on the command line).
appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true
- runFlow: subflows/dev-client.yaml
- runFlow:
    file: subflows/activate.yaml
    env:
      USERNAME: ${MAESTRO_USERNAME}
      PASSWORD: ${MAESTRO_PASSWORD}
      TOKEN: ${MAESTRO_ACTIVATION_TOKEN}

# Phase 2.5: medicines, today's doses and reminders.
- runFlow: subflows/medication.yaml
# Phase 2.7: the emergency card, the wallet PDF, the wallpaper, Medical ID.
- runFlow: subflows/emergency.yaml
