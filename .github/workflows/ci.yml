name: CI

on:
  pull_request:
  push:
    branches: [main]

# Actions are pinned to commit SHAs (tag in the comment); update them via Renovate/Dependabot.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
      - name: Lint and type-check (ruff, mypy --strict)
        working-directory: backend
        env:
          UV_PYTHON_DOWNLOADS: automatic
        run: |
          uv sync --frozen
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src tests alembic
      - name: Dev secrets for the CI stack
        run: python3 scripts/init_env.py
      - name: Tests in the Linux container (alembic up/down/up, RLS context, unit)
        run: docker compose -f infra/docker-compose.yml --env-file .env run --rm test
      - name: Tear down
        if: always()
        run: docker compose -f infra/docker-compose.yml --env-file .env down -v

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm exec biome ci .
      - name: Typecheck (shared, mobile, web)
        run: pnpm -r typecheck
      - name: Tests (node:test, jest, vitest)
        run: pnpm -r test
      - name: Expo doctor
        working-directory: mobile
        run: pnpm exec expo-doctor

  api-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate the OpenAPI client
        env:
          UV_PYTHON_DOWNLOADS: automatic
        run: |
          (cd backend && uv run python -m labtrack.cli openapi ../packages/shared/openapi.json)
          pnpm --filter @labtrack/shared gen
      - name: Fail if the committed client is stale
        run: git diff --exit-code -- packages/shared/openapi.json packages/shared/src/api/schema.d.ts
