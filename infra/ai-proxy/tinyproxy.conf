# Only CONNECT to port 443 of the hosts in `filter` (default deny); no plain HTTP elsewhere,
# no via headers, nothing logged but warnings (no URLs - they carry nothing, but stay quiet).
Port 8888
Listen 0.0.0.0
Timeout 180
MaxClients 20
LogLevel Warning
DisableViaHeader Yes
ConnectPort 443
Filter "/etc/tinyproxy/filter"
FilterType ere
FilterURLs Off
FilterDefaultDeny Yes
FilterCaseSensitive Off
