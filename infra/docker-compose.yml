name: labtrack

x-backend: &backend
  build:
    context: ../backend
    target: dev
  image: labtrack-backend:dev
  environment: &backend-env
    ENVIRONMENT: ${ENVIRONMENT:-dev}
    DATABASE_URL: postgresql+asyncpg://labtrack_app:${LABTRACK_APP_PASSWORD}@postgres:5432/labtrack
    REDIS_URL: redis://valkey:6379/0
    SENTRY_DSN: ${SENTRY_DSN:-}
  volumes:
    - ../backend/src:/app/src:ro
    - ../backend/tests:/app/tests:ro
    - ../backend/alembic:/app/alembic:ro
    - ../seed:/seed:ro

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LABTRACK_OWNER_PASSWORD: ${LABTRACK_OWNER_PASSWORD}
      LABTRACK_APP_PASSWORD: ${LABTRACK_APP_PASSWORD}
      LABTRACK_ADMIN_PASSWORD: ${LABTRACK_ADMIN_PASSWORD}
      LABTRACK_MAINT_PASSWORD: ${LABTRACK_MAINT_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d labtrack"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Valkey (BSD-3) instead of Redis 7.4+/8 (RSAL/SSPL/AGPL) - project licence policy.
  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - s3data:/data
      - ./seaweedfs/entrypoint.sh:/entrypoint.sh:ro
    ports: ["127.0.0.1:8333:8333"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9333/cluster/status >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    <<: *backend
    environment:
      <<: *backend-env
      MIGRATION_DATABASE_URL: postgresql+asyncpg://labtrack_owner:${LABTRACK_OWNER_PASSWORD}@postgres:5432/labtrack
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/readyz', timeout=3).status != 200)"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }

  worker:
    <<: *backend
    command: ["celery", "-A", "labtrack.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A labtrack.worker.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 20s
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    image: labtrack-web:dev
    environment:
      API_INTERNAL_URL: http://api:8000
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      api: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/api/v1/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }

  # `just test-api`: migrates the separate test DB, then runs pytest. Not started by `up`.
  test:
    <<: *backend
    profiles: ["test"]
    environment:
      <<: *backend-env
      ENVIRONMENT: test
      PYTEST_ADDOPTS: "-p no:cacheprovider"
      MIGRATION_DATABASE_URL: postgresql+asyncpg://labtrack_owner:${LABTRACK_OWNER_PASSWORD}@postgres:5432/labtrack_test
      TEST_DATABASE_URL: postgresql+asyncpg://labtrack_app:${LABTRACK_APP_PASSWORD}@postgres:5432/labtrack_test
      DATABASE_URL: postgresql+asyncpg://labtrack_app:${LABTRACK_APP_PASSWORD}@postgres:5432/labtrack_test
    entrypoint: ["sh", "-c", "alembic upgrade head && alembic downgrade base && alembic upgrade head && exec \"$$@\"", "--"]
    command: ["pytest", "-q", "--no-header"]
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }

volumes:
  pgdata:
  s3data:
